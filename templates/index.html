{% extends "layout.html" %}

{% block title %}
    Home
{% endblock %}

{% block main %}
    <div class = "reportCard">
        <h1>Welcome {{ user }}!</h1>
        <h2>Report your item</h2>
        <form class="reportForm" method="post" action="/submit" enctype="multipart/form-data">
            <div class="radioButtons">
                <label>
                    <input type="radio" name="type" value="lost" checked>
                    Lost
                </label>  
                <label>
                    <input type="radio" name="type" value="found">
                    Found
                </label>
            </div><br>
            <hr>

            {% if session.get("user") %}
                <h5>Required</h5><br>
                <label>Name of Item: <input type="text" name="title" required></label>
            {% else %}
                <h5>Required</h5><br>
                <label>Name of Item: <input type="text" name="title" required></label><br>
                <label>Your Email: <input type="text" name="email" required></label><br>
                <label>Your Name: <input type="text" name="name" required></label>
            {% endif %}

            <hr>
            <h5>Optional</h5><br>
            <label>Description: <input type="text" name="description"></label><br>
            <label>Image: <input type="file" name="image" accept="image/*"></label><br>
            <hr>
            <button id="submit" type="submit">Submit</button>
        </form>
    </div>
{% endblock %}
