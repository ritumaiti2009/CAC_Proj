{% extends "layout.html" %}
{% block title %}Account Settings{% endblock %}
{% block main %}
    <div class="card-form card mx-auto d-flex align-items-center">
        <div clas="card-body">
            {% if session.get("user_id") %}
                <form method="post"
                      action="{{ url_for('delete_account', id=session.get('user_id') ) }}">
                    <span data-bs-toggle="tooltip"
                          data-bs-placement="bottom"
                          title="Delete permanently">
                        <label for="deleteBtn" class="form-label">Delete Account:</label>
                        <button class="btn btn-outline-danger"
                                type="button"
                                data-bs-toggle="modal"
                                data-bs-target="#confirmDeleteModal"
                                id="deleteBtn">Delete</button>
                    </span>
                    <div class="modal fade"
                         id="confirmDeleteModal"
                         data-bs-backdrop="static"
                         data-bs-keyboard="false"
                         tabindex="-1"
                         aria-labelledby="confirmDeleteModal"
                         aria-hidden="true">
                        <div class="modal-dialog">
                            <div class="modal-content">
                                <div class="modal-header">
                                    <h1 class="modal-title fs-5">Confirm Delete</h1>
                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                </div>
                                <div class="modal-body">Are you sure you want to delete this account? (This is permanent)</div>
                                <div class="modal-footer">
                                    <button type="submit" class="btn btn-danger">Confirm Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            {% endif %}
        </div>
    </div>
{% endblock %}
