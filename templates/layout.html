<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">

    <title>{% block title %}{% endblock %}</title>
</head>
<body>

    <nav>
        <a href="/">Home</a>

        {% block nav %}
            {% if session.get("user") and session.get("status") == "admin" %}
                <a href="/manage_requests">Manage Requests</a>
                <a href="/manage_items">Manage Items</a>
            {% endif %}

            <a href="/lost">Lost Items</a>
            <a href="/found">Found Items</a>

            {% if session.get("user") %}
                <a href="/requests">Requests</a>
                <a href="/logout">Log Out</a>
            {% else %}
                <a href="/login">Log In</a>
            {% endif %}
        {% endblock %}

    </nav><br>
    {% block main %}{% endblock %}
</body>
</html>
