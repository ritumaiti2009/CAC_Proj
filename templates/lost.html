{% extends "list_layout.html" %}

{% block title %}
    Lost Items
{% endblock %}

{% block card %}
    {% for item in items %}
        <div class="card">
            <h5>Time: {{ item["date_reported"] }}</h5>
            <h4>Title: {{ item["title"] }}</h4>
            <p>Description: {{ item["description"] }}<p>
            {% if item["image_path"] %}
                <img src="{{ item['image_path'] }}" alt="{{ item['title'] }}" width="200px">
            {% endif %}
            <form method="GET" action="{{ url_for('request_item', id=item['id']) }}">
                <button type="submit">Request Info</button>
            </form>
        </div>
    {% endfor %}
{% endblock %}
