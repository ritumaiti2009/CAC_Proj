{% extends "layout.html" %}

{% block title %}
    Lost Items
{% endblock %}

{% block main %} 
    {% for item in items %}
        <div>
            <h4>{{ item[7] }}</h4>
            <h4>{{ item[2] }}</h4>
            <h4>{{ item[3] }}</h4><br>
            <h2>{{ item[4] }}</h2><br>
            <p>{{ item[5] }}<p><br>
            {% if item[6] %}
                <img src="{{ item[6] }}" alt="{{ item[4] }}" width="200px"><br>
            {% endif %}
        </div>
    {% endfor %}
{% endblock %}
