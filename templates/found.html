{% extends "list_layout.html" %}

{% block title %}
    Found Items
{% endblock %}

{% block card %}
    {% for item in items %}
        <div class="card">
            <h5>Time: {{ item[3] }}</h5>
            <h4>Title: {{ item[0] }}</h4>
            <p>Description: {{ item[1] }}<p>
            {% if item[2] %}
                <img src="{{ item[2] }}" alt="{{ item[0] }}" width="200px">
            {% endif %}
            <form method="GET" action="{{ url_for('request_item', id=item[0]) }}">
                <button type="submit">Request Info</button>
            </form>
        </div>
    {% endfor %}
{% endblock %}
